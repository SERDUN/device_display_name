name: device_display_name
description: "The name a person knows their device by (Redmi 9A, Galaxy XCover 5, iPhone 12 mini) instead of its hardware code, and the kind of device it is."
version: 0.1.0
homepage: https://github.com/SERDUN/device_display_name
repository: https://github.com/SERDUN/device_display_name
issue_tracker: https://github.com/SERDUN/device_display_name/issues
topics:
  - device
  - device-info
  - android
  - ios

environment:
  sdk: ^3.13.0
  flutter: '>=3.47.0'

platforms:
  android:
  ios:

dependencies:
  flutter:
    sdk: flutter

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  plugin:
    platforms:
      android:
        package: com.serdun.device_display_name
        pluginClass: DeviceDisplayNamePlugin
      ios:
        pluginClass: DeviceDisplayNamePlugin
